<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src http://127.0.0.1:3737">
<title>Proton</title>
<style>
@font-face{font-family:"Space Grotesk";src:local("Space Grotesk"),url("fonts/SpaceGrotesk.woff2") format("woff2");font-weight:300 700}
@font-face{font-family:"JetBrains Mono";src:local("JetBrains Mono"),url("fonts/JetBrainsMono.woff2") format("woff2");font-weight:100 800}
:root{--bg:#000;--side:rgba(255,255,255,.05);--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--g1:rgba(255,255,255,.085);--g2:rgba(255,255,255,.025);
--text:#f5f5f7;--mut:rgba(255,255,255,.52);--acc:#ff3b30;--ok:#f5f5f7;--bad:#ff7b72;
--serif:"Space Grotesk",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;--sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--mono:"JetBrains Mono","SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:#000;color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(620px 420px at 20% 6%,rgba(255,255,255,.075),transparent 70%),radial-gradient(720px 520px at 88% 92%,rgba(255,255,255,.055),transparent 70%)}
button,select,textarea,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,summary:focus-visible,.row:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px;border:2px solid transparent;background-clip:content-box}
.drag{-webkit-app-region:drag}
button,select,input,textarea,summary,.row{-webkit-app-region:no-drag}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* liquid glass surface */
#side,#composer,.chart,.stat,.approval,.u,#insights,#editorPane,dialog,.ws,.hb button,.ws button,.btns button{
background:linear-gradient(135deg,var(--g1),var(--g2));backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.17),inset 0 -1px 0 rgba(255,255,255,.03),0 10px 30px rgba(0,0,0,.6)}
#app{position:relative;display:flex;height:100%;padding:10px;gap:10px}
#side{width:260px;flex:none;border-radius:26px;display:flex;flex-direction:column;padding:0 10px 10px}
.brand{display:flex;align-items:center;gap:10px;font:600 22px var(--serif);letter-spacing:-.02em;padding:46px 8px 14px;-webkit-app-region:drag;background:linear-gradient(180deg,#fff,rgba(255,255,255,.5));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand svg,.hello svg.logo{color:#fff;fill:currentColor;filter:drop-shadow(0 0 10px rgba(255,255,255,.28))}
.brand svg{width:26px;height:26px}
.side-btn{display:flex;align-items:center;gap:9px;background:none;border:0;border-radius:999px;padding:8px 12px;text-align:left;cursor:pointer;color:var(--text)}
.side-btn:hover{background:rgba(255,255,255,.07)}
.ws{margin:10px 0;padding:10px;border-radius:20px;box-shadow:none}
.ws-name{display:flex;gap:8px;align-items:center;font-weight:500;overflow:hidden;white-space:nowrap}
.ws-name span{overflow:hidden;text-overflow:ellipsis}
.ws button{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:8px;width:100%;border-radius:999px;padding:6px;cursor:pointer;box-shadow:none}
.ws button:hover{border-color:rgba(255,255,255,.3)}
#tree{flex:1;overflow:auto;font:12px var(--mono);padding:4px 0}
.row{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;white-space:nowrap;color:var(--mut);cursor:default}
.row span{overflow:hidden;text-overflow:ellipsis}
.row:hover{background:rgba(255,255,255,.07);color:var(--text)}
.row svg{width:13px;height:13px}
.row .car{transition:transform .12s}.row .car.open{transform:rotate(90deg)}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;height:40px;padding:0 4px 0 8px;color:var(--mut);font:12px var(--mono);-webkit-app-region:drag}
#wsPath{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hb{display:flex;gap:8px;align-items:center;flex:none;font:13px var(--sans)}
.hb button{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 13px;cursor:pointer;color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.hb button:hover,.hb button.on{border-color:rgba(255,255,255,.34)}
.hb button.on{background:rgba(255,255,255,.14)}
.pill{border-color:rgba(255,59,48,.6)!important;color:var(--acc)!important;font-size:12px}
#chatWrap{flex:1;overflow:auto}
#chat{max-width:740px;margin:0 auto;padding:24px 24px 12px;display:flex;flex-direction:column;gap:18px}
.hello{margin-top:13vh;text-align:center}
.hello svg.logo{width:76px;height:76px;margin-bottom:10px}
.hello h1{font:500 36px/1.15 var(--serif);letter-spacing:-.03em;background:linear-gradient(180deg,#fff 20%,rgba(255,255,255,.45));-webkit-background-clip:text;background-clip:text;color:transparent}
.hello p{color:var(--mut);margin-top:10px;font:12px var(--mono)}
.hello button{margin-top:20px;background:#fff;border:0;border-radius:999px;padding:10px 22px;color:#000;font-weight:500;cursor:pointer}
.u{align-self:flex-start;border-radius:20px;padding:10px 16px;white-space:pre-wrap;max-width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.17)}
.a{font:15.5px/1.65 var(--serif);letter-spacing:-.005em}
.a p+p,.a ul,.a ol,.a pre,.a h3,.a h4,.a h5{margin-top:.8em}
.a ul,.a ol{padding-left:1.4em}
.a code{font:12.5px var(--mono);background:var(--side);padding:1px 6px;border-radius:6px}
.a pre{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:12px;overflow:auto}
.a pre code{background:none;padding:0}
.tool{font-size:13px;color:var(--mut)}
.tool summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
.tool summary::-webkit-details-marker{display:none}
.tool .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px var(--mono)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.run{background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pulse 1s infinite}.dot.ok{background:#f5f5f7}.dot.err{background:var(--acc)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}
.out{margin-top:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:10px 12px;max-height:240px;overflow:auto;font:12px var(--mono);white-space:pre-wrap;color:var(--text)}
.approval{border-radius:22px;padding:14px 16px;border-color:rgba(255,255,255,.26)}
.approval b{font-weight:500}
.approval pre{margin-top:8px;max-height:220px;overflow:auto;background:rgba(0,0,0,.45);border-radius:12px;padding:8px 10px;font:12px var(--mono);white-space:pre-wrap}
.approval .del{color:var(--bad);background:rgba(255,59,48,.12)}.approval .add{color:#e8e8ea;background:rgba(255,255,255,.07)}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{border-radius:999px;padding:6px 16px;cursor:pointer;box-shadow:none}
.btns .go{background:#fff;border-color:#fff;color:#000;font-weight:500}
.err-msg{color:var(--bad)}.note{color:var(--mut)}
.chart{border-radius:22px;padding:14px 16px;margin-top:.8em;font-family:var(--sans)}
.ct{font-size:12.5px;color:var(--mut);margin-bottom:6px}
.chart svg{display:block;width:100%;height:auto}
svg .ax{font:10px var(--mono);fill:var(--mut)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dn{display:flex;align-items:center;gap:16px}.dn .legend{flex-direction:column;gap:6px;margin:0}
#insights{width:340px;flex:none;border-radius:26px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
#insights h2{font:500 20px var(--serif);letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:18px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.stat b{display:block;font:500 20px var(--serif)}.stat span{font-size:12px;color:var(--mut)}
.fb{font:12px var(--mono);margin-top:8px}.fb div{display:flex;justify-content:space-between}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:3px}.meter i{display:block;height:100%;border-radius:3px;background:#fff}
#insights .chart{margin-top:0;box-shadow:none}
.fine{font-size:12px;color:var(--mut)}
#composerWrap{padding:0 0 4px}
#composer{max-width:740px;margin:0 auto;border-radius:28px;padding:12px 16px 10px}
#composer:focus-within{border-color:rgba(255,255,255,.34)}
#input{width:100%;background:none;border:0;outline:0;resize:none;max-height:200px;line-height:1.5;display:block}
#input::placeholder{color:var(--mut)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
#mode{background:none;border:0;color:var(--mut);cursor:pointer;font:12px var(--mono)}
#mode option{background:#111;color:var(--text)}
#send{width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:#000;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 18px rgba(255,255,255,.25)}
#send svg{width:16px;height:16px;stroke-width:2.2}
#editorPane{width:50%;flex:none;border-radius:26px;overflow:hidden}
#editorFrame{width:100%;height:100%;border:0;background:#000}
dialog{margin:auto;color:var(--text);border-radius:28px;padding:24px;width:440px;background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.04)),rgba(8,8,10,.78)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{font:500 22px var(--serif);letter-spacing:-.02em;margin-bottom:14px}
dialog label{display:block;margin-top:12px;color:var(--mut);font-size:13px}
dialog input{width:100%;margin-top:4px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:999px;padding:9px 14px;outline:0;font-family:var(--mono);font-size:12.5px}
dialog input:focus{border-color:rgba(255,255,255,.4)}
dialog .btns{justify-content:flex-end;margin-top:18px}

/* ===== Codex-style layout ===== */
#app{display:flex;flex-direction:column;padding:0;gap:0;height:100%}
#titlebar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px;-webkit-app-region:drag}
html.electron #titlebar{padding-left:84px}
.tb{display:flex;align-items:center;gap:4px}
.ib{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:none;border:0;color:var(--mut);cursor:pointer}
.ib:hover{background:rgba(255,255,255,.08);color:var(--text)}
.ib.on{background:rgba(255,255,255,.14);color:var(--text)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.ib svg{width:18px;height:18px}
#pill{border:1px solid rgba(255,59,48,.6);color:var(--acc);border-radius:999px;padding:4px 12px;font-size:12px;background:none;cursor:pointer;margin-right:6px}
#body{flex:1;min-height:0;display:flex}
#rail{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 14px}
#rail .ib{width:38px;height:38px;border-radius:12px}
#rail .sep{width:22px;height:1px;background:var(--line);margin:4px 0}
#rail .grow{flex:1}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#76767b,#2a2a2d);display:grid;place-items:center;font:600 11px var(--sans);color:#fff;border:1px solid var(--line);cursor:pointer}
.upd{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid var(--line);display:grid;place-items:center;color:#fff;cursor:pointer}
.upd svg{width:15px;height:15px}
#shell{flex:1;min-width:0;display:flex;border-radius:22px 0 0 0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:rgba(255,255,255,.03);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);overflow:hidden}
#side{width:248px;flex:none;border-radius:0;border:0;border-right:1px solid var(--line);background:rgba(255,255,255,.025);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:14px 10px 10px;display:flex;flex-direction:column;overflow:hidden}
#side.collapsed{display:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px 6px}
.ttl{display:flex;align-items:center;gap:8px;font:600 17px var(--serif);letter-spacing:-.02em;cursor:pointer;background:none;border:0;color:var(--text)}
.ttl svg.pm{width:22px;height:22px;color:#fff;fill:currentColor;filter:drop-shadow(0 0 8px rgba(255,255,255,.3))}
.ttl svg.ic{width:14px;height:14px;color:var(--mut)}
.sc{flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
.si{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;color:var(--text);cursor:pointer;white-space:nowrap}
.si span{overflow:hidden;text-overflow:ellipsis}
.si:hover{background:rgba(255,255,255,.06)}
.si.act{background:rgba(255,255,255,.1)}
.si.th{padding-left:38px;color:rgba(255,255,255,.8)}
.si.rc{color:rgba(255,255,255,.8)}
.sl{padding:16px 10px 6px;color:var(--mut);font-size:13px}
#q{width:100%;margin:0 0 6px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:999px;padding:7px 14px;outline:0;font-size:13px}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#chatWrap{flex:1;overflow:auto;display:flex;flex-direction:column}
#chat{flex:1;width:100%;max-width:760px;align-self:center;padding:24px 24px 12px}
.hello{margin:auto 0;text-align:center}
.hello h1{font-weight:400;font-size:36px}
.pn{border-bottom:1.5px dotted rgba(255,255,255,.55);cursor:pointer}
#composerWrap{padding:0 28px 22px}
#stack{max-width:900px;margin:0 auto}
#chip{display:flex;align-items:center;gap:8px;width:calc(100% - 28px);margin:0 14px -14px;padding:9px 16px 22px;border-radius:20px 20px 0 0;background:rgba(255,255,255,.05);border:1px solid var(--line);border-bottom:0;color:rgba(255,255,255,.88);cursor:pointer;font-size:14px}
#composer{position:relative;max-width:none;border-radius:26px;padding:16px 18px 12px}
#input{font-size:15px}
.crow{display:flex;align-items:center;gap:6px;margin-top:12px}
.crow .grow{flex:1}
.cp{display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:999px;padding:6px 10px;color:var(--mut);cursor:pointer;font-size:14px}
.cp:hover{background:rgba(255,255,255,.08);color:var(--text)}
.cp b{font-weight:500;color:var(--text)}
.cp svg{width:15px;height:15px}
#insights,#editorPane{border-radius:0;border:0;border-left:1px solid var(--line);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.02)}
.menu{position:fixed;z-index:50;min-width:230px;padding:6px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.05)),rgba(12,12,14,.84);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 44px rgba(0,0,0,.7)}
.mi{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 12px;border-radius:12px;cursor:pointer;font-size:14px}
.mi:hover{background:rgba(255,255,255,.09)}
.mi small{display:block;color:var(--mut);font-size:12px}
.mi svg{width:15px;height:15px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:60;padding:8px 18px;border-radius:999px;background:rgba(20,20,22,.85);border:1px solid var(--line);backdrop-filter:blur(20px);font-size:13px}
</style>
</head>

  <div id="titlebar">

/* ---- charts (pure SVG) ---- */
function axes(c, W, H, p, max) {
  let g = '';
  for (let k = 0; k <= 3; k++) {
    const y = p.t + (H - p.t - p.b) * (1 - k / 3);
    g += `<line x1="${p.l}" x2="${W - p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l - 6}" y="${y + 3}" text-anchor="end" class="ax">${Math.round(max * k / 3)}</text>`;
  }
  return g;
}
function barSvg(c) {
  const W = 320, H = 150, p = { l: 28, r: 6, t: 8, b: 22 }, iw = W - p.l - p.r, ih = H - p.t - p.b;
  const max = Math.max(1, ...c.series.flatMap((s) => s.data)), n = c.labels.length, slot = iw / n, k = c.series.length, bw = Math.min(26, slot * 0.7 / k);
  let g = axes(c, W, H, p, max);
  c.series.forEach((s, si) => s.data.forEach((v, i) => {
    const h = ih * v / max, x = p.l + slot * i + (slot - bw * k) / 2 + bw * si;
    g += `<rect x="${x}" y="${p.t + ih - h}" width="${bw - 2}" height="${h}" rx="3" fill="${PAL[si % PAL.length]}"/>`;
  }));
  c.labels.forEach((l, i) => { g += `<text x="${p.l + slot * (i + .5)}" y="${H - 6}" text-anchor="middle" class="ax">${esc(l)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function lineSvg(c) {
  const W = 320, H = 150, p = { l: 28, r: 8, t: 8, b: 22 }, iw = W - p.l - p.r, ih = H - p.t - p.b;
  const max = Math.max(1, ...c.series.flatMap((s) => s.data)), n = c.labels.length, base = p.t + ih;
  const X = (i) => p.l + iw * i / Math.max(1, n - 1), Y = (v) => p.t + ih - ih * v / max;
  let g = axes(c, W, H, p, max);
  c.series.forEach((s, si) => {
    const col = PAL[si % PAL.length], pts = s.data.map((v, i) => `${X(i)},${Y(v)}`);
    g += `<path d="M${pts.join('L')}L${X(n - 1)},${base}L${X(0)},${base}Z" fill="${col}" opacity=".14"/><path d="M${pts.join('L')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    s.data.forEach((v, i) => { g += `<circle cx="${X(i)}" cy="${Y(v)}" r="2.8" fill="${col}"/>`; });
  });

  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function donutHtml(c) {

  let off = 0;
  const segs = vals.map((v, i) => {

    off += l; return s;
  }).join('');
  const leg = c.labels.map((l, i) => `<span><i style="background:${PAL[i % PAL.length]}"></i>${esc(l)} ${vals[i]}</span>`).join('');

}
function chartHtml(c) {

  }
  return `<div class="chart">${c.title ? `<div class="ct">${esc(c.title)}</div>` : ''}${body}${leg}</div>`;
}

/* ---- markdown (with ```chart blocks) ---- */
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const inl = (s) => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
function md(src) {
  return src.split('```').map((p, i) => {
    if (i % 2) {
      const nl = p.indexOf('\n'), lang = nl >= 0 ? p.slice(0, nl).trim() : p.trim(), body = nl >= 0 ? p.slice(nl + 1) : '';
      if (lang === 'chart') { try { return chartHtml(JSON.parse(body)); } catch { return '<p class="note">Drawing chart…</p>'; } }
      return `<pre><code>${esc(body)}</code></pre>`;
    }
    return esc(p).split(/\n{2,}/).map((par) => {
      if (!par.trim()) return '';
      const L = par.split('\n');
      if (L.every((l) => /^\s*[-*] /.test(l))) return '<ul>' + L.map((l) => `<li>${inl(l.replace(/^\s*[-*] /, ''))}</li>`).join('') + '</ul>';
      if (L.every((l) => /^\s*\d+\. /.test(l))) return '<ol>' + L.map((l) => `<li>${inl(l.replace(/^\s*\d+\. /, ''))}</li>`).join('') + '</ol>';
      const h = par.match(/^(#{1,3}) (.*)/);
      if (h) return `<h${h[1].length + 2}>${inl(h[2])}</h${h[1].length + 2}>`;
      return '<p>' + inl(par).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }).join('');
}

      cur = null;
      const d = document.createElement('details'); d.className = 'tool';
      d.innerHTML = `<summary><span class="dot run"></span>${ic(TOOL_IC[ev.name] || 'file')}<span class="t"></span></summary><div class="out" hidden></div>`;
      d.querySelector('.t').textContent = label(ev.name, ev.input);
      chat.append(d); tools.set(ev.id, d); scroll(); break;
    }
    case 'approval': {
      const c = document.createElement('div'); c.className = 'approval';
      const title = ev.name === 'run_command' ? 'Run this command?' : 'Apply this change to ' + esc(ev.input.path) + '?';
      c.innerHTML = `<b>${title}</b>${preview(ev.name, ev.input)}<div class="btns"><button class="go">Allow</button><button class="no">Deny</button></div>`;
      c.querySelector('.go').onclick = () => { approve(ev.id, true); c.remove(); };
      c.querySelector('.no').onclick = () => { approve(ev.id, false); c.remove(); };
      chat.append(c); scroll(); break;
    }
    case 'tool_result': {
      const d = tools.get(ev.id); if (!d) break;
      d.querySelector('.dot').className = 'dot ' + (ev.error ? 'err' : 'ok');
      const o = d.querySelector('.out'); o.textContent = ev.output; o.hidden = false; break;
    }
    case 'done': setBusy(false); cur = null; if (ev.stopped) add('note', 'Stopped.'); renderSide(); break;
    case 'error': setBusy(false); cur = null; add('err-msg', ev.message); break;
  }
}
proton.onEvent(onEvent);

/* ---- preview mode: scripted conversation so every UI state is visible without an API key ---- */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function demo() {
  demoRun = true; demoCancel = false;
  const F = '```';
  const say = async (t) => { onEvent({ type: 'text_start' }); for (const c of t.match(/[\s\S]{1,5}/g)) { if (demoCancel) return; onEvent({ type: 'text', text: c }); await sleep(16); } };
  const tool = async (id, name, input, out, gate) => {
    if (demoCancel) return false;
    onEvent({ type: 'tool_start', id, name, input }); await sleep(500);
    if (gate) {
      const ok = await new Promise((r) => { demoWait = r; onEvent({ type: 'approval', id, name, input }); });
      if (!ok || demoCancel) { onEvent({ type: 'tool_result', id, output: 'The user denied this action.', error: true }); return false; }
      await sleep(300);
    }
    onEvent({ type: 'tool_result', id, output: out, error: false }); return true;
  };
  await say("I'll start by looking at how the project is laid out.");
  await tool('d1', 'list_dir', { path: '.' }, 'app/\nsrc/\nREADME.md\npackage.json');
  await tool('d2', 'read_file', { path: 'src/App.kt' }, '1\tclass App {\n2\t  fun build() = compile(cache = false)\n3\t}');
  await say('Builds skip the cache. I will turn it on.');
  const ok = await tool('d3', 'edit_file', { path: 'src/App.kt', old_str: 'compile(cache = false)', new_str: 'compile(cache = true)' }, 'Edited src/App.kt', true);
  if (ok) {
    await tool('d4', 'run_command', { command: './gradlew assembleDebug' }, 'BUILD SUCCESSFUL in 41s\n[exit 0]', true);
    const spec = { type: 'bar', title: 'Build time (seconds)', labels: ['Before', 'After'], series: [{ name: 'Debug', data: [118, 41] }, { name: 'Release', data: [204, 96] }] };
    await say('Done. Turning on the cache cut the build time a lot:\n\n' + F + 'chart\n' + JSON.stringify(spec) + '\n' + F + '\n\nThe change is one line in `src/App.kt`.');
  } else if (!demoCancel) await say('No problem. I left the file unchanged.');
  demoRun = false; onEvent({ type: 'done', stopped: demoCancel });
}
function stopRun() { if (demoRun) { demoCancel = true; if (demoWait) { demoWait(false); demoWait = null; } } else proton.stop(); }

/* ---- composer ---- */
function setBusy(b) { busy = b; sendBtn.innerHTML = ic(b ? 'stop' : 'send'); sendBtn.querySelector('path').style.fill = b ? 'currentColor' : 'none'; sendBtn.setAttribute('aria-label', b ? 'Stop' : 'Send'); }
function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; }
async function send() {
  const t = input.value.trim();
  if (!t) return;
  if (S.hasKey && !S.workspace) return pick();
  if (chat.querySelector('.hello')) chat.innerHTML = '';
  add('u', t); input.value = ''; grow(); setBusy(true);
  if (S.hasKey) proton.send(t); else demo();
}
sendBtn.onclick = () => (busy ? stopRun() : send());
input.addEventListener('input', grow);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) send(); } });

    + chartHtml({ type: 'bar', title: 'Edits this week', labels: ['M', 'T', 'W', 'T', 'F', 'S', 'S'], series: [{ data: [4, 9, 6, 12, 8, 3, 5] }] })
    + chartHtml({ type: 'line', title: 'Tokens per session (k)', labels: ['1', '2', '3', '4', '5', '6'], series: [{ data: [12, 18, 15, 26, 22, 31] }] })
    + chartHtml({ type: 'donut', title: 'Tool use', labels: ['Read', 'Edit', 'Search', 'Run'], series: [{ data: [34, 18, 9, 12] }] })
    + '<div class="chart"><div class="ct">Most edited files</div>' + files.map(([n, v]) => `<div class="fb"><div><span>${esc(n)}</span><span>${v}</span></div><div class="meter"><i style="width:${v / 14 * 100}%"></i></div></div>`).join('') + '</div>'
    + '<p class="fine">Sample data. Real numbers appear once the agent is connected.</p>';
}
$('#insBtn').onclick = () => { const p = $('#insights'); p.hidden = !p.hidden; $('#insBtn').classList.toggle('on', !p.hidden); if (!p.hidden) renderInsights(); };

/* ---- editor (Code-OSS) ---- */
function hideEditor() { $('#editorPane').hidden = true; $('#editorBtn').classList.remove('on'); $('#editorFrame').src = 'about:blank'; proton.stopEditor(); }
$('#editorBtn').onclick = async () => {
  const pane = $('#editorPane'), btn = $('#editorBtn');
  if (!pane.hidden) { pane.hidden = true; btn.classList.remove('on'); return; }
  if (IS_STUB) return toast('The editor runs in the desktop app');
  if (!S.workspace) return toast('Open a folder first');
  try { $('#editorFrame').src = await proton.startEditor(); pane.hidden = false; btn.classList.add('on'); }
  catch (e) { toast(clean(e)); }
};

/* ---- settings ---- */
function openSettings() {
  $('#apiKey').value = ''; $('#apiKey').placeholder = S.hasKey ? 'Saved. Paste a new key to replace it' : 'sk-ant-...';
  $('#model').value = S.model || ''; $('#editorPath').value = S.editorPath || '';
  $('#settings').showModal();
}
$('#settingsBtn').onclick = openSettings;
$('#pill').onclick = openSettings;
$('#cancelSettings').onclick = () => $('#settings').close();
$('#saveSettings').onclick = async () => {
  await proton.setSettings({ apiKey: $('#apiKey').value.trim(), model: $('#model').value, editorPath: $('#editorPath').value });
  S = { ...(await proton.getSettings()) }; renderWs();
  $('#settings').close();
};

(async function init() {
  if (navigator.userAgent.includes('Electron')) document.documentElement.classList.add('electron');
  hydrate(); setBusy(false);
  S = await proton.getSettings();
  if (S.workspace) addProject(S.workspace);
  renderTop(); renderSide(); empty();
})();
</script>
